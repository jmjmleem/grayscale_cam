<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GrayCode Camera Scanner</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 20px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    video { width: 100%; max-height: 70vh; background: #111; border-radius: 12px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
    button { padding: 10px 12px; font-size: 16px; }
    .status { padding: 10px 12px; background: #f3f4f6; border-radius: 12px; }
    .hint { color:#444; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>그레이 코드 실시간 인식</h2>
    <p class="hint">코드를 화면 중앙에 크게 맞추면 자동으로 이동합니다.</p>

    <div class="row">
      <button id="start">카메라 시작</button>
      <button id="stop" disabled>카메라 정지</button>
    </div>

    <div class="status" id="status">대기 중…</div>

    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

<script>
(() => {
  // ===== 설정 =====
  const N = 10; // 10x10 격자
  const TARGET_URL = "https://npl.khu.ac.kr/";
  const TARGET_HASH = "37c723268abb63613388e9dbf86fdce0b74bde1649b9f77de44010a9cfd504b9";
  const SCAN_INTERVAL_MS = 250;
  let opened = false;

  const statusEl = document.getElementById("status");
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const btnStart = document.getElementById("start");
  const btnStop = document.getElementById("stop");

  let stream = null;
  let timer = null;

  function setStatus(msg) { statusEl.textContent = msg; }

  async function sha256Hex(str) {
    const buf = new TextEncoder().encode(str);
    const hashBuf = await crypto.subtle.digest("SHA-256", buf);
    const bytes = new Uint8Array(hashBuf);
    return [...bytes].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function rgbToGray(r, g, b) {
    return Math.round(0.299*r + 0.587*g + 0.114*b);
  }

  // <=100 / 101~150 / 151~200 / >200  -> 0..3
  function quantize(gray) {
    if (gray <= 100) return 0;
    if (gray <= 150) return 1;
    if (gray <= 200) return 2;
    return 3;
  }

  function rotate90(levels) {
    const n = levels.length;
    const out = Array.from({length:n}, () => Array(n).fill(0));
    for (let r=0;r<n;r++) for (let c=0;c<n;c++) out[c][n-1-r] = levels[r][c];
    return out;
  }
  const rotate180 = (m) => rotate90(rotate90(m));
  const rotate270 = (m) => rotate90(rotate180(m));

  function flatten(levels) {
    let s = "";
    for (let r=0;r<N;r++) for (let c=0;c<N;c++) s += String(levels[r][c]);
    return s;
  }

  function captureCenterTo100() {
    const w = video.videoWidth;
    const h = video.videoHeight;
    if (!w || !h) return null;

    const s = Math.min(w, h);
    const sx = Math.floor((w - s) / 2);
    const sy = Math.floor((h - s) / 2);

    canvas.width = 100;
    canvas.height = 100;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(video, sx, sy, s, s, 0, 0, 100, 100);
    return ctx.getImageData(0, 0, 100, 100);
  }

  async function scanOnce() {
    if (opened) return;
    const imgData = captureCenterTo100();
    if (!imgData) return;

    const { data } = imgData; // RGBA 100*100*4
    const cell = 10;

    function sampleAvg(x, y) {
      let sum = 0, cnt = 0;
      for (let dy=-1; dy<=1; dy++) {
        for (let dx=-1; dx<=1; dx++) {
          const xx = Math.min(99, Math.max(0, x+dx));
          const yy = Math.min(99, Math.max(0, y+dy));
          const idx = (yy*100 + xx) * 4;
          sum += rgbToGray(data[idx], data[idx+1], data[idx+2]);
          cnt++;
        }
      }
      return Math.round(sum / cnt);
    }

    const levels = Array.from({length:N}, () => Array(N).fill(0));
    for (let r=0; r<N; r++) {
      for (let c=0; c<N; c++) {
        const x = c*cell + Math.floor(cell/2);
        const y = r*cell + Math.floor(cell/2);
        const g = sampleAvg(x, y);
        levels[r][c] = quantize(g);
      }
    }

    const candidates = [levels, rotate90(levels), rotate180(levels), rotate270(levels)];
    for (const m of candidates) {
      const hash = await sha256Hex(flatten(m));
      if (hash === TARGET_HASH) {
        opened = true;
        setStatus("인식 성공! 이동합니다…");
        window.location.href = TARGET_URL;
        return;
      }
    }
    setStatus("스캔 중… (코드를 화면 중앙에 크게 맞춰주세요)");
  }

  async function startCamera() {
    opened = false;
    setStatus("카메라 권한 요청 중…");
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
        audio: false
      });
      video.srcObject = stream;

      btnStart.disabled = true;
      btnStop.disabled = false;

      await new Promise(resolve => {
        if (video.readyState >= 2) resolve();
        else video.onloadedmetadata = () => resolve();
      });

      setStatus("스캔 시작! 코드를 중앙에 맞추세요.");
      timer = setInterval(scanOnce, SCAN_INTERVAL_MS);
    } catch (err) {
      setStatus("카메라 시작 실패: " + err);
    }
  }

  function stopCamera() {
    if (timer) { clearInterval(timer); timer = null; }
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    btnStart.disabled = false;
    btnStop.disabled = true;
    setStatus("카메라 정지됨.");
  }

  btnStart.addEventListener("click", startCamera);
  btnStop.addEventListener("click", stopCamera);

  if (location.protocol !== "https:" && location.hostname !== "localhost") {
    setStatus("주의: 카메라는 HTTPS에서만 동작합니다. GitHub Pages로 배포하세요.");
  }
})();
</script>
</body>
</html>
